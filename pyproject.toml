[project]
name = "ai-x-automation"
version = "0.1.0"
description = "Daily AI real-data curation, screenshot capture, and X growth posting bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.10.0",
    "jinja2>=3.1.5",
    "playwright>=1.50.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "requests>=2.32.3",
    "requests-oauthlib>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
