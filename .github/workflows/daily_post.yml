name: Daily AI X Growth Bot

on:
  schedule:
    # ~9:00 AM US Pacific (17:00 UTC) and ~4:00 PM US Pacific (00:00 UTC)
    - cron: "0 17 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting to X (saves screenshots to workflow artifacts)"
        type: boolean
        default: true
      source_override:
        description: "Force a specific data source or leave as auto"
        type: choice
        default: auto
        options:
          - auto
          - huggingface_models
          - huggingface_papers
          - github_trending
          - model_benchmarks
      post_format_override:
        description: "Force single tweet or thread, or leave as auto"
        type: choice
        default: auto
        options:
          - auto
          - single
          - thread

permissions:
  contents: write

jobs:
  curate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add natural posting jitter on scheduled runs
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 420))
          echo "Sleeping ${DELAY}s for natural cadence..."
          sleep "$DELAY"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies and Playwright Chromium
        run: |
          uv sync --frozen || uv sync
          uv run playwright install chromium --with-deps

      - name: Run daily AI X bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_HANDLE: ${{ vars.X_HANDLE || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SOURCE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_override || 'auto' }}
          POST_FORMAT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.post_format_override || 'auto' }}
        run: uv run python -m src.main

      - name: Upload generated screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-screenshots-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated posting history
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record daily X post in history [skip ci]"
            git push
          fi
